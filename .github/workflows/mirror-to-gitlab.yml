name: Mirror main to GitLab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_URL: https://gitlab.dellace.xyz/tppo/backend.git
        run: |
          auth=$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"

          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            push --force "$GITLAB_URL" 'refs/remotes/origin/main:refs/heads/main'
